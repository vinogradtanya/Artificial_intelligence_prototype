{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="card center">
  <h1>Регистрация</h1>
  <form method="post">
    <label for="username">Логин (мин. 3 символа)</label>
    <input id="username" name="username" value="{{ form.get('username', '') }}" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ form.get('email', '') }}" required>
    <label for="password">Пароль (мин. 6 символов)</label>
    <input id="password" name="password" type="password" required>
    <label for="password2">Повтор пароля</label>
    <input id="password2" name="password2" type="password" required>
    <button type="submit">Создать аккаунт</button>
  </form>
  <p class="muted">Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войти</a></p>
</div>
{% endblock %}
